name: Add contract to root registry
description: Register a deployed contract instance in the Stellar Registry root registry.
title: "Add contract to root registry: "
labels: ["governance", "add-contract"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for requesting a change to the Stellar Registry root registry!

        Mainnet doesn't have on-chain DAO gating yet — testnet does, via
        Tansu, but mainnet governance is this issue process — so a
        maintainer reviews this request and runs the transaction below by
        hand.

        See [#1](https://github.com/stellar-registry/gov/issues/1) for a past
        example of a similar request and how it was handled.

  - type: input
    id: contract_name
    attributes:
      label: Contract name
      description: >-
        The name to register in the root registry. Lowercase letters,
        numbers, and hyphens; optionally `channel/name`.
      placeholder: my-contract
    validations:
      required: true

  - type: input
    id: contract_address
    attributes:
      label: Contract address
      description: The deployed contract's address.
      placeholder: CABCD…
    validations:
      required: true

  - type: input
    id: owner_address
    attributes:
      label: Owner address
      description: >-
        Who should own this registry entry going forward — able to update or
        transfer it later. Defaults to your own address below if left blank.
      placeholder: GABCD… or CABCD…
    validations:
      required: false

  - type: input
    id: requester_address
    attributes:
      label: Your Stellar address
      description: So we know who's asking.
      placeholder: GABCD…
    validations:
      required: true

  - type: input
    id: requester_github
    attributes:
      label: Your GitHub username
      placeholder: octocat
    validations:
      required: false

  - type: textarea
    id: justification
    attributes:
      label: Justification
      description: Who are you, and why should this be trusted in the root registry?
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Runnable command
      description: >-
        Pre-filled from the fields above when this issue is opened from
        rgstry.xyz's governance form — a maintainer (or you, if you hold the
        appropriate signing key) can run this directly.
      render: shell
    validations:
      required: false
